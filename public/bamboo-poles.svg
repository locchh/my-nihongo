<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="pole" x1="0" x2="1">
      <stop offset="0" stop-color="#d4b46a"/>
      <stop offset="0.18" stop-color="#eed898"/>
      <stop offset="0.42" stop-color="#fbf2cf"/>
      <stop offset="0.62" stop-color="#f4e5ae"/>
      <stop offset="0.86" stop-color="#e3c77c"/>
      <stop offset="1" stop-color="#c9a659"/>
    </linearGradient>
    <linearGradient id="node" x1="0" x2="1">
      <stop offset="0" stop-color="#bf9a4a"/>
      <stop offset="0.4" stop-color="#e6cc85"/>
      <stop offset="0.6" stop-color="#e6cc85"/>
      <stop offset="1" stop-color="#b8924a"/>
    </linearGradient>
    <!-- one joint: a slightly wider collar with a shadow above it and a lit
         rim beneath -->
    <g id="joint">
      <rect x="-1.5" y="-1" width="35" height="2.5" fill="#a07d3a" opacity="0.4"/>
      <rect x="-1.5" y="1" width="35" height="6" rx="2.5" fill="url(#node)"/>
      <rect x="-1" y="7" width="34" height="2" fill="#fff8dc" opacity="0.8"/>
    </g>
    <!-- one pole, with its two joints at the same heights as every other pole -->
    <g id="pole-with-joints">
      <rect x="0" y="0" width="30" height="220" fill="url(#pole)"/>
      <use href="#joint" x="0" y="58"/>
      <use href="#joint" x="0" y="150"/>
    </g>
  </defs>
  <rect width="160" height="220" fill="#b9975a"/>
  <use href="#pole-with-joints" x="1"/>
  <use href="#pole-with-joints" x="33"/>
  <use href="#pole-with-joints" x="65"/>
  <use href="#pole-with-joints" x="97"/>
  <use href="#pole-with-joints" x="129"/>
</svg>
